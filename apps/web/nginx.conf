# SPA: qualquer rota (ex: /coleta/:token, /acompanhar/:token) cai no index.html,
# deixando o React Router decidir o que renderizar.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Sem isso o header Content-Type não leva "charset=utf-8" e o navegador pode
    # interpretar o HTML/JS com outra codificação, quebrando acentos (ã, ç, á...).
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.png {
        expires 7d;
        add_header Cache-Control "public";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
