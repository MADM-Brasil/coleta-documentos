services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forms_madm
      POSTGRES_PASSWORD: forms_madm
      POSTGRES_DB: forms_madm
    ports:
      - "5432:5432"
    volumes:
      - forms_madm_pg_data:/var/lib/postgresql/data

volumes:
  forms_madm_pg_data:
