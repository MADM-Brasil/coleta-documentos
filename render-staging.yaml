services:
  # API de TESTE — mesmo código do main, banco e URL próprios (isolado da produção).
  - type: web
    name: forms-madm-api-staging
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    # Plano free do Render não suporta disco persistente — os arquivos enviados ficam
    # só até o próximo deploy/reinício, o que é aceitável num ambiente de teste.
    envVars:
      # O Render free só permite 1 banco Postgres grátis por conta — reaproveita o
      # mesmo banco da produção (forms-madm-db), mas isolado num schema próprio via
      # "?schema=staging" no final da connection string, pra não misturar os dados.
      # Copie a DATABASE_URL do serviço forms-madm-api (produção) e cole aqui com
      # esse sufixo (ex: postgresql://user:pass@host/forms_madm?schema=staging).
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 4000
      # Preencha estas duas depois do primeiro deploy, quando o Render mostrar
      # as URLs finais de cada serviço (ex: https://forms-madm-api-staging.onrender.com).
      - key: APP_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: LOCAL
      - key: UPLOADS_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE_MB
        value: 200
      # Sala de atendimento (vídeo) — pode reaproveitar o mesmo projeto LiveKit da
      # produção (tem tier gratuito) ou criar um projeto LiveKit separado só pra testes.
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      # Senha única do painel do consultor (/painel) e segredo de assinatura da sessão.
      - key: AGENT_PASSWORD
        sync: false
      - key: AGENT_SESSION_SECRET
        generateValue: true

  # Portal (frontend) de TESTE
  - type: web
    name: forms-madm-web-staging
    runtime: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # Preencha com a URL final da API de staging depois do primeiro deploy
      # (ex: https://forms-madm-api-staging.onrender.com) e clique em "Manual Deploy" de novo.
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # index.html nunca deve ficar em cache (senão o navegador/CDN mostra a versão antiga
    # do site por até 5 minutos depois de um deploy novo) — só os arquivos com hash no
    # nome (/assets/*, já gerados pelo Vite) podem ficar em cache por muito tempo.
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
