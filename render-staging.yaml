databases:
  - name: forms-madm-db-staging
    plan: free
    databaseName: forms_madm_staging
    user: forms_madm_staging

services:
  # API de TESTE — mesmo código do main, banco e URL próprios (isolado da produção).
  - type: web
    name: forms-madm-api-staging
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    disk:
      name: forms-madm-uploads-staging
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: forms-madm-db-staging
          property: connectionString
      - key: PORT
        value: 4000
      # Preencha estas duas depois do primeiro deploy, quando o Render mostrar
      # as URLs finais de cada serviço (ex: https://forms-madm-api-staging.onrender.com).
      - key: APP_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: LOCAL
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: MAX_FILE_SIZE_MB
        value: 200
      # Sala de atendimento (vídeo) — pode reaproveitar o mesmo projeto LiveKit da
      # produção (tem tier gratuito) ou criar um projeto LiveKit separado só pra testes.
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false

  # Portal (frontend) de TESTE
  - type: web
    name: forms-madm-web-staging
    runtime: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # Preencha com a URL final da API de staging depois do primeiro deploy
      # (ex: https://forms-madm-api-staging.onrender.com) e clique em "Manual Deploy" de novo.
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
