databases:
  - name: forms-madm-db
    plan: free
    databaseName: forms_madm
    user: forms_madm

services:
  # API — webhook do Make/Kommo + portal do cliente (backend)
  - type: web
    name: forms-madm-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    disk:
      name: forms-madm-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: forms-madm-db
          property: connectionString
      - key: PORT
        value: 4000
      # Preencha estas duas depois do primeiro deploy, quando o Render mostrar
      # as URLs finais de cada serviço (ex: https://forms-madm-api.onrender.com).
      - key: APP_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: LOCAL
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: MAX_FILE_SIZE_MB
        value: 200

  # Portal do cliente (frontend estático)
  - type: web
    name: forms-madm-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # Preencha com a URL final da API depois do primeiro deploy
      # (ex: https://forms-madm-api.onrender.com) e clique em "Manual Deploy" de novo.
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
